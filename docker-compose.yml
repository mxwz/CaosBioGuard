services:
  mysql:
    image: mysql:8.0
    container_name: caos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caos_bioguard}
      MYSQL_USER: ${MYSQL_USER:-caos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    # 不向宿主机暴露 3306；仅 Web 容器通过内部网络访问 MySQL。
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysql", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: caos-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      FLASK_PORT: ${WEB_PORT:-6100}
      CAOS_FLASK_SECRET_KEY: ${CAOS_FLASK_SECRET_KEY:?CAOS_FLASK_SECRET_KEY is required}
      CAOS_ENCRYPTION_KEY: ${CAOS_ENCRYPTION_KEY:?CAOS_ENCRYPTION_KEY is required}
      CAOS_SYNC_TOKEN: ${CAOS_SYNC_TOKEN:?CAOS_SYNC_TOKEN is required}
      CAOS_AGENT_TOKEN: ${CAOS_AGENT_TOKEN:?CAOS_AGENT_TOKEN is required}
      CAOS_HMAC_SECRET: ${CAOS_HMAC_SECRET:-}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caos_bioguard}
      MYSQL_USER: ${MYSQL_USER:-caos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-6100}:6100"
    volumes:
      - ./dd:/app/dd
      - ./sideUI/dd:/app/sideUI/dd
      - ./sideUI/face_images:/app/sideUI/face_images
      - ./web_admin/uploads:/app/web_admin/uploads
      - ${HOME}/.insightface:/root/.insightface:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6100/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  edge:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge
    container_name: caos-edge
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: xcb
      CAOS_ENCRYPTION_KEY: ${CAOS_ENCRYPTION_KEY:?CAOS_ENCRYPTION_KEY is required}
      TZ: Asia/Shanghai
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./dd:/app/dd
      - ./sideUI/dd:/app/sideUI/dd
      - ./sideUI/face_images:/app/sideUI/face_images
      - ${HOME}/.insightface:/root/.insightface:ro

volumes:
  mysql_data:
